<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Página en GitHub Pages</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }

    .card {
      max-width: 540px;
      width: 100%;
      background-color: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      padding: 0.3rem 0.65rem;
      border-radius: 999px;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 1.75rem;
      line-height: 1.2;
      margin-bottom: 0.75rem;
    }

    p {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    button {
      background-color: var(--accent);
      color: #082f49;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      padding: 0.65rem 1.1rem;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    button:hover {
      opacity: 0.9;
    }

    #status {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: var(--text);
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">GitHub Pages</span>
    <h1>¡Hola! Mi sitio está en línea</h1>
    <p>
      Esta es una página de prueba creada con HTML, CSS y JavaScript. Si estás viendo esto,
      tu repositorio y tu despliegue funcionan correctamente.
    </p>
    <button id="test-btn" type="button">Probar interacción</button>
    <div id="status" aria-live="polite"></div>
  </main>

  <script>
    const btn = document.getElementById("test-btn");
    const status = document.getElementById("status");
    let clicks = 0;

    btn.addEventListener("click", () => {
      clicks += 1;
      status.textContent = `JavaScript activo: botón pulsado ${clicks} ${clicks === 1 ? "vez" : "veces"}.`;
    });
  </script>
</body>
</html>
